name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SOLANA_VERSION: "4.3.2"
  ANCHOR_VERSION: "0.31.1"

jobs:
  rust-format:
    name: Rust format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets

  program-tests:
    name: Build program and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev

      - name: Cache Rust and Anchor
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/avm
            ~/.avm
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-

      - name: Install Solana CLI
        run: |
          if [ ! -d "$HOME/.local/share/solana/install/active_release" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          if [ ! -x "$HOME/.cargo/bin/avm" ]; then
            cargo install --git https://github.com/coral-xyz/anchor avm --force
          fi
          avm install "${ANCHOR_VERSION}"
          avm use "${ANCHOR_VERSION}"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Create a throwaway test wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json

      - name: Install JavaScript packages
        run: yarn install --frozen-lockfile

      # CI has no program key (it is never committed), so make a throwaway one and
      # put its id into the code BEFORE building, so the build and the key always match.
      - name: Create a throwaway program key and write its id into the code
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent --force --outfile target/deploy/escrow-keypair.json
          ID=$(solana-keygen pubkey target/deploy/escrow-keypair.json)
          echo "Program id for this run: $ID"
          sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"$ID\")/" programs/escrow/src/lib.rs
          sed -i "s/^escrow = \"[^\"]*\"/escrow = \"$ID\"/" Anchor.toml

      - name: Build the program
        run: anchor build

      - name: Show the ids (for debugging)
        run: |
          echo "key file:     $(solana-keygen pubkey target/deploy/escrow-keypair.json)"
          echo "lib.rs:       $(grep -o 'declare_id!("[^"]*")' programs/escrow/src/lib.rs)"
          echo "Anchor.toml:"; grep -n '^escrow' Anchor.toml
          echo "IDL address:  $(grep -o '"address": *"[^"]*"' target/idl/escrow.json | head -1)"

      - name: Run tests
        run: anchor test --skip-build

  app-build:
    name: Build the web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
